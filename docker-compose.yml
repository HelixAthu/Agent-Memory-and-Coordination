services:
  falkordb:
    image: falkordb/falkordb:v4.22.1
    container_name: memory-fabric-falkordb
    ports:
      - "6379:6379"
      - "3000:3000"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memory-fabric-backend
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: memory-fabric-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped
