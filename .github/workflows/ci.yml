name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests & Evals
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:v4.22.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Seed Database
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: 6379
        run: |
          python seed/seed.py --reset

      - name: Run Pytest Suite
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: 6379
        run: |
          pytest -v

      - name: Run Evals Harness
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: 6379
        run: |
          python evals/run_evals.py

  frontend:
    name: Frontend Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build

      - name: Run Vitest Unit & Reducer Tests
        run: npx vitest run
